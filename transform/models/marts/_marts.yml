version: 2

models:
  - name: dim_tournament
    description: >
      Un tournoi par ligne, toutes disciplines confondues. C'est le modèle où
      les échelles de tiers se rejoignent en un rang comparable.
    columns:
      - name: tournament_key
        description: "Clé lisible : source, discipline, identifiant de page."
        data_tests: [unique, not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["counterstrike", "dota2", "valorant"]
      - name: tier_rank
        description: 1 pour l'élite, 5 pour l'amateur. Nul si le tier n'est pas traduit.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: prize_pool_usd
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: has_date_conflict
        description: >
          Vrai quand la source donne une fin antérieure au début. La fin et la
          durée sont alors laissées inconnues plutôt que fausses, mais le
          conflit reste visible ici.
        data_tests: [not_null]
      - name: duration_days
        description: >
          Bornes incluses. Nul si l'une des deux dates manque, ou si elles se
          contredisent.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1

  - name: fct_match
    description: >
      Une partie jouée par ligne, toutes disciplines confondues : un match
      Dota 2, une carte Valorant. Seulement ce que les disciplines ont en
      commun — le détail vit dans `fct_map`, `fct_player_map` et `fct_round`.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["dota2", "valorant"]
      - name: started_at
        data_tests: [not_null]
      - name: winning_side
        description: 1 ou 2, jamais nul — une partie sans vainqueur ne sert à rien.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: duration_seconds
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 21600

  - name: fct_series
    description: >
      Une rencontre par ligne — Bo1, Bo3 ou Bo5 — reliée à son tournoi par
      identifiant.
    columns:
      - name: series_key
        data_tests: [unique, not_null]
      - name: played_at
        data_tests: [not_null]
      - name: winning_side
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

  - name: fct_map
    description: Une carte jouée par ligne, avec son veto et ses statistiques d'équipe.
    columns:
      - name: map_key
        data_tests: [unique, not_null]
      - name: map_name
        data_tests: [not_null]
      - name: winning_side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: rounds_played
        description: Une carte se gagne à 13 manches ; le perdant en a au moins zéro.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 13
                max_value: 80
      - name: side_1_starting_side
        data_tests:
          - accepted_values:
              arguments:
                values: ["atk", "def"]

  - name: fct_player_map
    description: >
      La feuille de statistiques d'un joueur sur une carte, taux par manche
      compris.
    columns:
      - name: player_map_key
        data_tests: [unique, not_null]
      - name: agent
        data_tests: [not_null]
      - name: acs
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
      - name: kast_pct
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: headshot_pct
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_round
    description: >
      Une manche par ligne, avec le score au moment où elle commence et le
      sort du premier kill.
    columns:
      - name: round_key
        data_tests: [unique, not_null]
      - name: winning_side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: winning_role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["atk", "def"]
      - name: outcome
        description: >
          Les quatre façons de finir une manche. Une cinquième signifierait que
          le jeu a changé, ou que la page se lit mal.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "Spike detonated"
                  - "Spike defused"
                  - "Enemy eliminated"
                  - "Timer expired"

  - name: fct_veto
    description: Le veto, une étape par ligne.
    columns:
      - name: veto_key
        data_tests: [unique, not_null]
      - name: action
        data_tests:
          - accepted_values:
              arguments:
                values: ["ban", "pick", "decider"]
