version: 2

models:
  - name: dim_tournament
    description: >
      Un tournoi par ligne, toutes disciplines confondues. C'est le modèle où
      les échelles de tiers se rejoignent en un rang comparable.
    columns:
      - name: tournament_key
        description: "Clé lisible : source, discipline, identifiant de page."
        data_tests: [unique, not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["counterstrike", "dota2"]
      - name: tier_rank
        description: 1 pour l'élite, 5 pour l'amateur. Nul si le tier n'est pas traduit.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: prize_pool_usd
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: duration_days
        description: Bornes incluses. Nul si l'une des deux dates manque.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1

  - name: fct_match
    description: >
      Un match par ligne. Seul Dota 2 est couvert pour l'instant : les colonnes
      sont neutres pour que Counter-Strike puisse s'y ajouter sans refonte.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["dota2"]
      - name: started_at
        data_tests: [not_null]
      - name: winning_side
        description: 1 ou 2, jamais nul — un match sans vainqueur ne sert à rien.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: duration_seconds
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 21600
