version: 2

models:
  - name: stg_opendota__matches
    description: >
      Matchs OpenDota, renommés dans un vocabulaire neutre : camp 1 et camp 2
      plutôt que radiant et dire.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: started_at
        data_tests: [not_null]
      - name: winning_side
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

  - name: stg_liquipedia__tournaments
    description: >
      Tournois Liquipedia, nettoyés sans être interprétés : le tier reste celui
      de la source.
    columns:
      - name: page_id
        data_tests: [not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["counterstrike", "dota2", "valorant"]
      - name: tier_type
        description: Ramené en minuscules, la casse variant d'une page à l'autre.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [wiki, page_id]

  - name: stg_liquipedia__matches
    description: Rencontres terminées, une par ligne, document JSON encore replié.
    columns:
      - name: series_key
        data_tests: [unique, not_null]

  - name: stg_liquipedia__match_maps
    description: Cartes jouées, dépliées du document de leur rencontre.
    columns:
      - name: map_key
        data_tests: [unique, not_null]

  - name: stg_liquipedia__match_players
    description: Ligne de statistiques d'un joueur sur une carte.
    columns:
      - name: player
        description: Titre de la page du joueur — la seule identité stable.
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [map_key, player]

  - name: stg_liquipedia__match_rounds
    description: Manches, une par ligne.
    columns:
      - name: round_key
        data_tests: [unique, not_null]

  - name: stg_liquipedia__match_veto
    description: Étapes du veto, dans l'ordre.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [series_key, veto_order]
