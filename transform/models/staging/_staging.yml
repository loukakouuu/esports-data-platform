version: 2

models:
  - name: stg_opendota__matches
    description: >
      Matchs OpenDota, renommés dans un vocabulaire neutre : camp 1 et camp 2
      plutôt que radiant et dire.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: started_at
        data_tests: [not_null]
      - name: winning_side
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

  - name: stg_liquipedia__tournaments
    description: >
      Tournois Liquipedia, nettoyés sans être interprétés : le tier reste celui
      de la source.
    columns:
      - name: page_id
        data_tests: [not_null]
      - name: discipline
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["counterstrike", "dota2"]
      - name: tier_type
        description: Ramené en minuscules, la casse variant d'une page à l'autre.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [wiki, page_id]
