name: CI

on:
  push:
    branches: [main]
  pull_request:

# Les tests ne touchent jamais le réseau : les réponses des fournisseurs sont
# rejouées depuis des instantanés versionnés dans tests/fixtures.
env:
  UV_FROZEN: "1"

jobs:
  qualite:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: La ligne de commande démarre
        run: uv run esports-ingest --help
