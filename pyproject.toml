[project]
name = "esports-data-platform"
version = "0.1.0"
description = "Chaîne de données sur l'esport professionnel : ingestion multi-sources, normalisation, analyse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    # DuckDB s'en sert pour rendre les TIMESTAMPTZ en datetime Python.
    "pytz>=2024.1",
    "python-dotenv>=1.0",
]

[project.scripts]
esports-ingest = "ingestion.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "PTH", # pathlib plutôt qu'os.path
    "ARG", # arguments inutilisés
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # les doublures reçoivent des arguments qu'elles ignorent

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ingestion", "tests"]
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
